<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FactoryAspects Showcase</title>
    <base href="/" />

    <!-- Restores a returning visitor's saved theme/palette before first paint,
         instead of flashing the default and then jumping — see
         Blazor/docs/install.md step 5. Must run before the fa-styles.css <link>
         below. -->
    <script>
      (function () {
        var theme = localStorage.getItem('fa-theme');
        if (theme) document.documentElement.setAttribute('data-theme', theme);
        var palette = localStorage.getItem('fa-palette');
        if (palette) document.documentElement.setAttribute('data-fa-palette', palette);
      })();
    </script>

    <!-- The library's static assets, per Blazor/docs/install.md step 4. Not
         auto-injected by the RCL — every consumer adds these tags by hand. -->
    <link rel="stylesheet" href="_content/FactoryAspects/css/fa-styles.css" />

    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_content/FactoryAspects/js/theme.js"></script>
    <script src="_content/FactoryAspects/js/sidebar.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
