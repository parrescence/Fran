name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FactoryAspects.csproj

      - name: Build
        run: dotnet build FactoryAspects.csproj --no-restore --configuration Release

      - name: Pack (sanity check only — publish.yml does the real push)
        run: dotnet pack FactoryAspects.csproj --no-build --configuration Release -o ./artifacts
