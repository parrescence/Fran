name: CI (Blazor)

# One workflow file per library (ci-<library>.yml) — this one only ever
# builds/packs Blazor/. Adding a new library (React/, Vue/, ...) means adding its
# own ci-<library>.yml from this template, never editing this one.
#
# Trigger stays unconditional (not path-filtered) on purpose: build-and-pack-blazor
# is a REQUIRED status check on test/main branch protection. If the trigger itself
# were scoped to Blazor/**, a PR touching only other folders (root files, a sibling
# library) would never fire this workflow at all, and GitHub leaves a
# required-but-never-reported check permanently blocking merge. Instead, the job
# always runs and always reports a status, but the actual build/pack steps below are
# skipped (job still succeeds) unless something under Blazor/ (or this workflow
# file) actually changed.
on:
  pull_request:
    branches: [dev, test, main]
  push:
    branches: [dev, test, main]

jobs:
  build-and-pack-blazor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check for Blazor changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            blazor:
              - "Blazor/**"
              - ".github/workflows/ci-blazor.yml"

      - name: Setup .NET
        if: steps.changes.outputs.blazor == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        if: steps.changes.outputs.blazor == 'true'
        run: dotnet restore Blazor/Fran.csproj

      - name: Build
        if: steps.changes.outputs.blazor == 'true'
        run: dotnet build Blazor/Fran.csproj --no-restore --configuration Release

      - name: Test
        if: steps.changes.outputs.blazor == 'true'
        run: dotnet test Blazor/tests/Fran.Tests/Fran.Tests.csproj --configuration Release

      - name: Pack (sanity check only — publish-blazor.yml does the real push)
        if: steps.changes.outputs.blazor == 'true'
        run: dotnet pack Blazor/Fran.csproj --no-build --configuration Release -o ./artifacts

      # Fran-Showcase (a separate private repo) builds against this repo's Blazor/
      # via a source-level ProjectReference in a sibling checkout, so a Blazor
      # change here needs to kick off its CI/deploy too — GitHub Actions can't do
      # that on its own across repos, so this fires a repository_dispatch at it.
      # Only on an actual push to dev (not PRs, not test/main, not a no-op run) —
      # FRAN_SHOWCASE_DISPATCH_TOKEN is a fine-grained PAT scoped to just that repo's
      # Contents:read + Actions:write, the minimum that lets this call succeed.
      - name: Notify Fran-Showcase (Blazor changed on dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && steps.changes.outputs.blazor == 'true'
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.FRAN_SHOWCASE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/parrescence/fran-showcase/dispatches \
            -d '{"event_type":"blazor-updated"}'
